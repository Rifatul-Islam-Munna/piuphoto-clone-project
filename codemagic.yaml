workflows:
  ios_testflight:
    name: iOS TestFlight Upload
    max_build_duration: 120
    instance_type: mac_mini_m2
    working_directory: mobileapp

    inputs:
      app_version:
        description: "TestFlight version (major.minor.patch); version tags override this"
        type: string
        default: "1.0.3" # Change here or enter a version in Start new build.
      build_number:
        description: "Build number: auto uses Codemagic's project counter; or enter a positive integer"
        type: string
        default: "auto"

    triggering:
      cancel_previous_builds: true
      events:
        - tag
      branch_patterns:
        - pattern: main
          include: true
          source: true
      tag_patterns:
        - pattern: "v+([0-9]).+([0-9]).+([0-9])"
          include: true

    integrations:
      app_store_connect: nikofly

    environment:
      flutter: stable
      xcode: "26.6" # Supported Codemagic default; pin to avoid major-version upgrades.
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.nikofly.app
      vars:
        APP_NAME: Runner
        APP_VERSION: ${{ inputs.app_version }}
        APP_BUILD_NUMBER: ${{ inputs.build_number }}

    cache:
      cache_paths:
        - $HOME/.pub-cache
        - $HOME/Library/Caches/CocoaPods
        - $HOME/Library/Caches/org.swift.swiftpm
        - $HOME/Library/Developer/Xcode/DerivedData/CompilationCache.noindex

    scripts:
      - name: Set TestFlight version and build number
        script: |
          set -euo pipefail
          release_version="$APP_VERSION"
          if [ -n "${CM_TAG:-}" ]; then
            release_version="${CM_TAG#v}"
          fi
          release_build_number="${APP_BUILD_NUMBER:-auto}"
          if [ "$release_build_number" = "auto" ]; then
            release_build_number="${PROJECT_BUILD_NUMBER:?Missing Codemagic project build number}"
          fi
          if ! [[ "$release_version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid app version: $release_version. Use major.minor.patch (e.g. 1.0.1)."
            exit 1
          fi
          if ! [[ "$release_build_number" =~ ^[1-9][0-9]*$ ]]; then
            echo "Invalid build number: $release_build_number. Use a positive integer."
            exit 1
          fi
          printf 'RELEASE_VERSION=%s\nRELEASE_BUILD_NUMBER=%s\n' \
            "$release_version" "$release_build_number" >> "$CM_ENV"
          echo "TestFlight version: $release_version ($release_build_number)"

      - name: Flutter pub get
        script: |
          flutter pub get

      - name: Verify iOS permission descriptions
        script: |
          plutil -lint ios/Runner/Info.plist
          for key in NSCameraUsageDescription NSPhotoLibraryUsageDescription NSPhotoLibraryAddUsageDescription NSLocalNetworkUsageDescription; do
            purpose=$(/usr/libexec/PlistBuddy -c "Print :$key" ios/Runner/Info.plist) || exit 1
            if [ -z "$(echo "$purpose" | tr -d '[:space:]')" ]; then
              echo "Missing iOS purpose string: $key"
              exit 1
            fi
          done

      - name: Install pods
        script: |
          find . -name "Podfile" -execdir pod install \;

      - name: Set up iOS code signing
        script: |
          xcode-project use-profiles

      - name: Build signed IPA
        script: |
          set -euo pipefail
          flutter build ipa --release \
            --build-name="$RELEASE_VERSION" \
            --build-number="$RELEASE_BUILD_NUMBER" \
            --export-options-plist=/Users/builder/export_options.plist

      - name: Diagnose App Store identity
        script: |
          set +e

          IPA_PATH="$(find build/ios/ipa -name '*.ipa' -print -quit)"
          echo "IPA: ${IPA_PATH:-NOT_FOUND}"
          echo "Expected bundle ID: com.nikofly.app"
          echo "Codemagic integration: nikofly"
          echo "Version: $RELEASE_VERSION"
          echo "Build number: $RELEASE_BUILD_NUMBER"

          echo "Available signing identities:"
          security find-identity -v -p codesigning

          if [ -z "$IPA_PATH" ]; then
            echo "ERROR: IPA not found"
            exit 1
          fi

          DIAG_DIR="$PWD/ipa_diagnostics"
          rm -rf "$DIAG_DIR"
          mkdir -p "$DIAG_DIR"
          unzip -q "$IPA_PATH" -d "$DIAG_DIR"
          APP_PATH="$(find "$DIAG_DIR/Payload" -maxdepth 1 -name '*.app' -print -quit)"

          echo "App bundle: $APP_PATH"
          echo "Bundle ID: $(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$APP_PATH/Info.plist")"
          echo "Display name: $(/usr/libexec/PlistBuddy -c 'Print :CFBundleDisplayName' "$APP_PATH/Info.plist")"
          echo "Version: $(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$APP_PATH/Info.plist")"
          echo "Build: $(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$APP_PATH/Info.plist")"

          PROFILE_PLIST="$DIAG_DIR/profile.plist"
          security cms -D -i "$APP_PATH/embedded.mobileprovision" > "$PROFILE_PLIST"
          echo "Profile name: $(/usr/libexec/PlistBuddy -c 'Print :Name' "$PROFILE_PLIST")"
          echo "Profile team ID: $(/usr/libexec/PlistBuddy -c 'Print :TeamIdentifier:0' "$PROFILE_PLIST")"
          echo "Profile app ID: $(/usr/libexec/PlistBuddy -c 'Print :Entitlements:application-identifier' "$PROFILE_PLIST")"
          echo "Profile expires: $(/usr/libexec/PlistBuddy -c 'Print :ExpirationDate' "$PROFILE_PLIST")"

          echo "Code signature:"
          codesign -dv --verbose=4 "$APP_PATH" 2>&1 | grep -E 'Identifier=|TeamIdentifier=|Authority='

          echo "NOTE: If bundle ID is com.nikofly.app but publishing still says Apple ID cannot be determined,"
          echo "the App Store Connect API key behind integration 'nikofly' belongs to another team"
          echo "or lacks App Manager/access to this app."

    artifacts:
      - build/ios/ipa/*.ipa
      - build/ios/iphoneos/*.app
      - /tmp/xcodebuild_logs/*.log
      - flutter_drive.log

    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        submit_to_app_store: false

  # Optional manual diagnostics. Select ios_testflight to upload an IPA.
  ios_camera_validation:
    name: iOS Camera Tests (manual, no TestFlight upload)
    max_build_duration: 90
    instance_type: mac_mini_m2
    working_directory: mobileapp

    environment:
      flutter: stable
      xcode: "26.6"

    cache:
      cache_paths:
        - $HOME/.pub-cache
        - $HOME/Library/Caches/CocoaPods

    scripts:
      - name: Resolve Flutter dependencies
        script: flutter pub get

      - name: Install iOS pods
        script: |
          cd ios
          pod install

      - name: Flutter regression tests
        script: |
          set -euo pipefail
          # The FTP peer-address test uses a second loopback source address.
          # macOS requires this address to be explicitly assigned to lo0.
          sudo -n /sbin/ifconfig lo0 alias 127.0.0.2 up
          flutter test --no-pub

      - name: Compile unsigned iOS simulator app
        script: flutter build ios --simulator --debug --no-codesign --no-pub

      - name: Native camera lifecycle and protocol tests
        script: |
          set -euo pipefail
          package_results() {
            if [ -d build/ios-camera-tests.xcresult ]; then
              ditto -c -k --sequesterRsrc --keepParent \
                build/ios-camera-tests.xcresult build/ios-camera-tests.xcresult.zip || true
            fi
          }
          trap package_results EXIT
          SIMULATOR_ID="$(xcrun simctl list devices available --json | python3 -c '
          import json, sys
          devices = json.load(sys.stdin)["devices"]
          ids = [device["udid"] for runtime, entries in devices.items()
                 if ".iOS-" in runtime for device in entries
                 if device.get("isAvailable") and device["name"].startswith("iPhone")]
          if not ids:
              raise SystemExit("No available iPhone simulator runtime")
          print(ids[0])
          ')"
          xcodebuild test \
            -workspace ios/Runner.xcworkspace \
            -scheme Runner \
            -configuration Debug \
            -destination "platform=iOS Simulator,id=$SIMULATOR_ID" \
            -derivedDataPath build/ios-native-tests \
            -resultBundlePath build/ios-camera-tests.xcresult \
            CODE_SIGNING_ALLOWED=NO

    artifacts:
      - build/ios/iphonesimulator/*.app
      - build/ios-camera-tests.xcresult.zip
